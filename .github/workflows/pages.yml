name: pages

# Publica solo la carpeta sitio/ en GitHub Pages cada vez que main cambia.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # versionado: cada publicación obliga al navegador a bajar los CSS y JS nuevos (sin esto se mezclan versiones en caché)
      - name: Versionar CSS y JS con el commit
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" sitio/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
