[project]
name = "portafolio"
version = "1.0.0"
description = "Pruebas y scripts del portafolio web (Taller Herramientas III). El sitio vive en sitio/ y no necesita Python."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pypdf>=5",
    "pytest>=8.3",
    "pytest-playwright>=0.7",
    "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
addopts = "-q"
markers = ["e2e: recorridos de QA como los haría cada visitante (ti-probar)"]

[tool.ruff]
line-length = 120
