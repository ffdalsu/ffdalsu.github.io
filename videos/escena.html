<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Escena de video</title>
  <!--
    Escena de los videos de proyecto (F7). La graba scripts/grabar_video.py cuadro a cuadro:
      escena.html?proyecto=<slug>  →  window.render(t) dibuja el segundo t;  window.VIDEO trae duración y cps.
    Todo depende solo de t (nada de relojes ni azar real), para que cada grabación salga idéntica.
    Plantilla de 40 s: intro (0-5) · problema (5-13) · solución (13-27) · stack (27-35) · cierre (35-40).
  -->
  <link rel="stylesheet" href="../sitio/lib/fuentes/fuentes.css">
  <link rel="stylesheet" href="../sitio/css/estilos.css">
  <style>
    html, body { margin: 0; background: #120D04; overflow: hidden; }
    #video { display: block; width: 1920px; height: 1080px; }
    /* lienzo auxiliar donde se dibuja la escena del proyecto antes de copiarla al cuadro */
    #panel { position: absolute; left: -5000px; top: 0; width: 1040px; height: 600px; }
  </style>
</head>
<body>
  <canvas id="video" width="1920" height="1080"></canvas>
  <canvas id="panel"></canvas>

  <script src="../sitio/lib/jquery-3.7.1/jquery.min.js"></script>
  <script src="../sitio/js/ascii/rejilla.js"></script>
  <script src="../sitio/js/ascii/sprite.js"></script>
  <script src="../sitio/js/oceano/bit.js"></script>
  <script src="../sitio/js/miniaturas.js"></script>
  <script>
  (function () {
    const PROYECTOS = {
      facturacion: {
        titulo: 'Sistema de facturación', escena: 'factura',
        problema: ['las ventas se llevan en cuadernos y hojas sueltas', 'nadie sabe cuánto se vende ni a quién'],
        solucion: ['clientes, productos y empleados en un solo lugar', 'facturas con el IVA calculado al instante', 'informes, inicio de sesión y roles'],
        stack: ['C#', '.NET', 'Windows Forms', 'SQLite']
      },
      hermes: {
        titulo: 'Hermes · base de conocimiento', escena: 'hermes',
        problema: ['el conocimiento del equipo vive en pocas cabezas', 'responder «¿dónde corre esto?» toma horas'],
        solucion: ['una wiki en Markdown con una ficha por proyecto', 'agentes de IA que la consultan y la mantienen', 'respuestas que citan su fuente'],
        stack: ['Python', 'Markdown', 'LLM', 'agentes']
      },
      indicadores: {
        titulo: 'Herramienta de indicadores', escena: 'indicadores',
        problema: ['los indicadores llegan tarde y en Excel', 'cada área los calcula distinto'],
        solucion: ['tableros web con filtros', 'cifras que se explican solas', 'una sola fuente de datos'],
        stack: ['FastAPI', 'React', 'SQL Server']
      },
      automatizaciones: {
        titulo: 'Automatizaciones', escena: 'automatizaciones',
        problema: ['tareas repetitivas que consumen horas', 'alertas que dependen de que alguien se acuerde'],
        solucion: ['tareas programadas que cruzan datos', 'alertas por correo, a tiempo', 'horas de trabajo manual ahorradas'],
        stack: ['Python', 'SQL Server', 'tareas programadas']
      },
      portafolio: {
        titulo: 'Este portafolio', escena: 'onda',
        problema: ['un portafolio de plantilla no cuenta quién eres'],
        solucion: ['un océano ASCII: ψ = Σ sin(k·r − ωt)', 'bit, una mascota que reacciona a lo que haces', 'tres páginas, modo claro y oscuro'],
        stack: ['HTML', 'CSS', 'Bootstrap', 'jQuery', 'Canvas']
      }
    };

    const C = { fondo: '#120D04', panel: '#1B1407', texto: '#FFB547', tenue: '#A57A30', acento: '#FFE2A6' };
    const SEG = { intro: 0, problema: 5, solucion: 13, stack: 27, cierre: 35, fin: 40 };
    const slug = new URLSearchParams(location.search).get('proyecto') || 'facturacion';
    const p = PROYECTOS[slug];
    const r = Portafolio.Rejilla(document.getElementById('video'), { tamFuente: 26 });
    const panel = Portafolio.Rejilla(document.getElementById('panel'), { tamFuente: 20 });
    const bit = Portafolio.Bit().sprite;
    const escena = Portafolio.Miniaturas.escenas[p.escena];
    Portafolio.Miniaturas.usarColores(C);

    const azar = (n) => { const x = Math.sin(n * 12.9898) * 43758.5453; return x - Math.floor(x); };
    /** Parte de un texto que ya se «escribió» en el segundo t, empezando en t0 a cps caracteres por segundo. */
    const escribir = (texto, t, t0, cps) => Array.from(texto).slice(0, Math.max(0, Math.floor((t - t0) * (cps || 30)))).join('');
    const centro = (texto, escala) => (r.cols - Array.from(texto).length * (escala || 1)) / 2;
    /** Título que se arma desde estática ASCII (como las habilidades del sitio): en «dura» segundos las letras
        se fijan de izquierda a derecha; las que faltan muestran un carácter de ruido que cambia cada cuadro. */
    const descifrar = (texto, t, t0, dura) => {
      if (t < t0) return '';
      const letras = Array.from(texto), fijas = (t - t0) / dura * letras.length;
      return letras.map((c, i) => (c === ' ' || i < fijas) ? c : '.:-=+*#%@'[Math.floor(azar(i * 13 + Math.floor(t * 30)) * 9)]).join('');
    };

    function olas(t, fila0) {
      for (let c = 0; c < r.cols; c++) {
        const y = fila0 + Math.sin(c * 0.18 - t * 1.6) * 0.8 + Math.sin(c * 0.07 + t * 0.6) * 0.5;
        r.dibujo(['~'], c, Math.round(y), C.texto, 1);
        for (let f = Math.round(y) + 2; f < r.filas; f += 2) if ((c + f + Math.floor(t * 3)) % 5 === 0) r.dibujo(['·'], c, f, C.tenue, 1);
      }
    }

    function dibujarBit(c, f, estado, t, escala) {
      r.dibujo(bit.cuadro(estado, t, estado === 'habla' ? 5 : 1.2), c, f, C.acento, escala, true, C.fondo);
    }

    function globo(texto, c, f) {
      const linea = '─'.repeat(Array.from(texto).length + 2);
      r.dibujo(['┌' + linea + '┐', '│ ' + texto + ' │', '└' + linea + '┘'], c, f, C.texto, 1, true, C.fondo);
    }

    function caja(titulo, c, f, ancho, alto) {
      const arriba = '┌─┤ ' + titulo + ' ├' + '─'.repeat(Math.max(0, ancho - Array.from(titulo).length - 7)) + '┐';
      r.dibujo([arriba], c, f, C.tenue, 1);
      for (let i = 1; i < alto; i++) r.dibujo(['│'], c, f + i, C.tenue, 1), r.dibujo(['│'], c + ancho - 1, f + i, C.tenue, 1);
      r.dibujo(['└' + '─'.repeat(ancho - 2) + '┘'], c, f + alto, C.tenue, 1);
    }

    /** Transición: una cortina de estática ASCII que barre la pantalla en 0,5 s alrededor de cada corte. */
    function cortina(t) {
      [SEG.problema, SEG.solucion, SEG.stack, SEG.cierre].forEach((corte) => {
        const d = t - (corte - 0.25);
        if (d < 0 || d > 0.5) return;
        const frente = d / 0.5 * (r.cols + 12);
        for (let c = 0; c < r.cols; c++) {
          if (c > frente || c < frente - 12) continue;
          for (let f = 0; f < r.filas; f++) r.dibujo(['.:-=+*#%@'[Math.floor(azar(c * 31 + f * 7 + Math.floor(t * 30)) * 9)]], c, f, C.tenue, 1);
        }
      });
    }

    function render(t) {
      const ctx = r.ctx;
      ctx.fillStyle = C.fondo; ctx.fillRect(0, 0, r.ancho, r.alto);
      const marca = 'juan-david:~/portafolio';
      r.dibujo([marca], 2, 1, C.tenue, 1);
      r.dibujo([String(Math.floor(t)).padStart(2, '0') + 's / ' + SEG.fin + 's'], r.cols - 12, 1, C.tenue, 1);

      if (t < SEG.problema) {
        // intro: el comando se escribe solo, aparece el título y bit saluda desde el agua
        olas(t, r.filas - 7);
        r.dibujo(['$ ' + escribir('./presentar ' + slug, t, 0.4, 18)], 6, 6, C.texto, 1.3);
        if (t > 2) r.dibujo([descifrar(p.titulo, t, 2, 1.4)], centro(p.titulo, 2.4), 12, C.acento, 2.4);
        dibujarBit(10, r.filas - 7 - 3 * 2.2 + Math.sin(t * 2) * 0.3, t > 2.8 ? 'habla' : 'flota', t, 2.2);
        if (t > 2.8) globo('¡hola! te presento un proyecto', 24, r.filas - 12);
      } else if (t < SEG.solucion) {
        // el problema: dos líneas que se escriben, con bit preocupado al lado
        const t0 = SEG.problema;
        caja('el problema', 8, 7, r.cols - 16, 4 + p.problema.length * 3);
        p.problema.forEach((l, i) => r.dibujo(['✗ ' + escribir(l, t, t0 + 0.6 + i * 1.8, 26)], 13, 10 + i * 3, i ? C.texto : C.acento, 1.25));
        dibujarBit(r.cols - 22, r.filas - 9, Math.floor(t * 2) % 2 ? 'flota' : 'duerme', t, 2.2);
        olas(t, r.filas - 3);
      } else if (t < SEG.stack) {
        // la solución: la escena del proyecto en grande y los puntos clave a la derecha
        const t0 = SEG.solucion;
        panel.ctx.fillStyle = C.panel; panel.ctx.fillRect(0, 0, panel.ancho, panel.alto);
        escena(panel, t - t0);
        ctx.drawImage(panel.canvas, 4 * r.cw, 4 * r.ch, panel.ancho, panel.alto);
        ctx.strokeStyle = C.tenue; ctx.lineWidth = 1; ctx.strokeRect(4 * r.cw - 0.5, 4 * r.ch - 0.5, panel.ancho + 1, panel.alto + 1);
        const x = 4 + Math.ceil(panel.ancho / r.cw) + 4;
        r.dibujo(['la solución'], x, 5, C.tenue, 1);
        p.solucion.forEach((l, i) => {
          const visible = escribir(l, t, t0 + 1 + i * 3, 26);
          if (!visible) return;
          r.dibujo(['✓'], x, 8 + i * 5, C.acento, 1.4);
          const palabras = visible.split(' '), lineas = [''];
          palabras.forEach((w) => { if ((lineas[lineas.length - 1] + ' ' + w).length > r.cols - x - 8) lineas.push(w); else lineas[lineas.length - 1] = (lineas[lineas.length - 1] + ' ' + w).trim(); });
          r.dibujo(lineas, x + 3, 8 + i * 5, C.texto, 1.15);
        });
        r.dibujo([p.titulo], 4, 5 + Math.ceil(panel.alto / r.ch), C.tenue, 1);
      } else if (t < SEG.cierre) {
        // el stack: cada tecnología cae en su caja, una tras otra
        const t0 = SEG.stack;
        r.dibujo(['construido con'], centro('construido con', 1.3), 6, C.tenue, 1.3);
        const anchos = p.stack.map((s) => Array.from(s).length + 4);
        const total = anchos.reduce((a, b) => a + b, 0) * 1.6 + (p.stack.length - 1) * 3;
        let c = Math.max(2, (r.cols - total) / 2);
        p.stack.forEach((s, i) => {
          const llega = t0 + 0.6 + i * 0.9, d = t - llega;
          if (d >= 0) {
            const caida = Math.max(0, 1 - d * 3);
            const f = 13 - caida * 8;
            const linea = '─'.repeat(anchos[i] - 2);
            r.dibujo(['┌' + linea + '┐', '│ ' + s + ' │', '└' + linea + '┘'], c, f, d < 0.4 ? C.acento : C.texto, 1.6, true, C.fondo);
          }
          c += anchos[i] * 1.6 + 3;
        });
        dibujarBit(centro('     ', 2.2), r.filas - 10, 'flota', t, 2.2);
        olas(t, r.filas - 4);
      } else {
        // cierre: bit se despide y queda la dirección del portafolio
        olas(t, r.filas - 7);
        dibujarBit(centro('     ', 2.6), r.filas - 7 - 3 * 2.6, 'habla', t, 2.6);
        globo('¡gracias por ver!', Math.round(r.cols / 2) + 9, r.filas - 16);
        r.dibujo([descifrar(marca, t, SEG.cierre + 0.2, 1.2)], centro(marca, 2), 6, C.acento, 2);
        const url = 'ffdalsu.github.io';
        r.dibujo([escribir(url, t, SEG.cierre + 0.5, 20)], centro(url, 1.4), 11, C.texto, 1.4);
      }
      cortina(t);
    }

    window.render = render;
    window.VIDEO = { duracion: SEG.fin, cps: 30, proyecto: slug, listo: document.fonts.ready.then(() => { r.medir(); panel.medir(); return true; }) };
  })();
  </script>
</body>
</html>
